[project]
name = "enterprise-graph-mcp"
version = "0.1.0"
description = "Enterprise Graph & Directory MCP Server"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp[cli]>=2.0.0a1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.0.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
]

[project.scripts]
enterprise-graph-mcp = "enterprise_graph_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

# Docker Compose for Enterprise Graph MCP Server
# Run with: docker compose up --build

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - EGD_DATABASE_URL=postgresql://postgres:postgres@db:5432/enterprise_graph
      - EGD_SYNC_INTERVAL_SECONDS=300
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      db:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server
      
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"          # <- add this
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=enterprise_graph
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"   # UI — browse traces here
      - "4317:4317"     # OTLP gRPC receiver — the SDK sends here
      - "4318:4318"     # OTLP HTTP receiver (optional)
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  pgdata: